    <script>
        // 请求持久化存储：避免浏览器因站点配额/存储压力把 ~50MB 的引擎缓存
        // (CacheStorage) 按 LRU 回收，从而防止"隔一天不访问就要重新下载引擎文件"。
        // 关键事实：navigator.storage.persist() 对"非已安装 PWA"往往返回 false，
        // Chrome 只在用户手势或站点高活跃时授予持久化；因此这里在首次用户交互
        // (点击/键盘/触摸) 时再次请求，并把持久化结果输出到控制台便于核实。
        (function () {
            function report(label, persisted, granted) {
                if (window.console && console.log) {
                    console.log('[xiangqi-storage] ' + label +
                        ' persisted=' + persisted +
                        ' persistGranted=' + (granted === undefined ? 'n/a' : granted));
                }
            }
            function tryPersist() {
                if (!navigator.storage || typeof navigator.storage.persist !== 'function') { return; }
                navigator.storage.persist().then(function (granted) {
                    if (typeof navigator.storage.persisted === 'function') {
                        navigator.storage.persisted().then(function (p) {
                            report('persist', p, granted);
                        }).catch(function () { report('persist', 'n/a', granted); });
                    } else {
                        report('persist', 'n/a', granted);
                    }
                }).catch(function () {});
            }
            // 页面加载时先请求一次。
            tryPersist();
            // Chrome 在用户手势下更可能授予持久化：首次交互时再请求一次。
            var once = true;
            function onGesture() {
                if (!once) { return; }
                once = false;
                tryPersist();
                window.removeEventListener('click', onGesture);
                window.removeEventListener('keydown', onGesture);
                window.removeEventListener('touchstart', onGesture);
                window.removeEventListener('pointerdown', onGesture);
            }
            window.addEventListener('click', onGesture);
            window.addEventListener('keydown', onGesture);
            window.addEventListener('touchstart', onGesture);
            window.addEventListener('pointerdown', onGesture);
        })();
    </script>

    <script>
        // 跨源隔离引导：GitHub Pages 无法直接下发 COOP/COEP 头，
        // 只能由 Service Worker 给首次导航响应注入。因此首次加载（无 SW 控制时）
        // 页面未隔离，SharedArrayBuffer 不可用。这里注册 SW，待它接管后一次性刷新，
        // 使文档经 SW 重新导航从而带上 COOP/COEP，达成跨源隔离。
        (function () {
            if (!('serviceWorker' in navigator)) { return; }
            var AUTO = 'xiangqi-co-auto';       // 1 = 上一次导航是本脚本注入的自动刷新
            var COUNT = 'xiangqi-co-count';     // 注入式自动刷新的次数（用于兜住恶性循环）
            var LAST = 'xiangqi-co-last';       // 上一次自动刷新的时间戳（简单限流）
            var MIN_MS = 1500;                  // 自动刷新的最小间隔
            var MAX_AUTO = 3;                   // 自动刷新次数上限，防止隔离迟迟不来时无限刷新

            function isIsolated() { return window.crossOriginIsolated === true; }
            function clearKeys() {
                sessionStorage.removeItem(AUTO);
                sessionStorage.removeItem(COUNT);
                sessionStorage.removeItem(LAST);
            }

            // 已隔离：本次会话完成，清除全部遗留标记便于后续环境变化时重走引导
            if (isIsolated()) { clearKeys(); return; }

            // 判断本次加载是否由我们注入的自动刷新触发
            var fromAuto = sessionStorage.getItem(AUTO) === '1';
            var n = parseInt(sessionStorage.getItem(COUNT) || '0', 10);
            sessionStorage.removeItem(AUTO); // 消费该标记
            // 手动/全新导航与自动刷新无关：计数清零
            if (!fromAuto) n = 0;

            var reloading = false;
            function doReload() {
                // 防止 controllerchange 与 setTimeout(ready) 并发触发重复刷新，
                // 避免双重重载竞争导致文档尚未经 SW 注入隔离头就被中断。
                if (reloading) { return; }
                if (isIsolated()) { clearKeys(); return; }
                reloading = true;
                sessionStorage.setItem(LAST, String(Date.now()));
                sessionStorage.setItem(AUTO, '1');
                sessionStorage.setItem(COUNT, String(n + 1));
                location.reload();
            }

            if (navigator.serviceWorker.controller) {
                // SW 已接管但尚未隔离。
                if (fromAuto) {
                    // 我们注入的刷新还没生效：受限流 + 次数上限兜底，防止无限刷新循环。
                    if (n < MAX_AUTO) {
                        setTimeout(function () {
                            if (isIsolated()) { clearKeys(); return; }
                            var now = Date.now(), last = parseInt(sessionStorage.getItem(LAST) || '0', 10);
                            if (now - last >= MIN_MS) doReload();
                        }, MIN_MS);
                    }
                } else {
                    // 手动刷新（用户主动行为）：立即重试一次，不受限流约束，
                    // 否则连点刷新时隔离一直被拖住，引擎进度会卡在 0%。
                    doReload();
                }
            } else {
                // 首次加载，SW 尚未接管：等它接管后刷新，使文档进入 SW 作用域以获得 COOP/COEP。
                navigator.serviceWorker.addEventListener('controllerchange', doReload);
                navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(function () {
                    navigator.serviceWorker.ready.then(function () {
                        setTimeout(doReload, 200);
                    }).catch(function () {});
                }).catch(function () {});
            }
        })();
    </script>

<body>
    <noscript>
        <strong>丰帆象棋需要使用JavaScript</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
    <script>
        // 关于界面底部：显示 引擎版本 / 最近更新时间 / 更新文件及大小 / 缓存文件及大小。
        // 不修改压缩后的前端 bundle，用 MutationObserver 在"关于"对话框打开时注入。
        (function () {
            if (!window.MutationObserver) { return; }
            var DATA_URL = '/build-info.json';
            var FALLBACK_URL = '/version.json';
            var injected = new WeakMap(); // 防止对同一个 DOM 节点重复注入

            function fmtSize(n) {
                if (n == null || isNaN(n)) { return '—'; }
                if (n < 1024) { return n + ' B'; }
                if (n < 1048576) { return (n / 1024).toFixed(1) + ' KB'; }
                return (n / 1048576).toFixed(2) + ' MB';
            }

            function esc(s) {
                return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
                });
            }

            function fetchJSON(url) {
                return fetch(url, { cache: 'no-store' }).then(function (r) {
                    if (!r.ok) { throw new Error('HTTP ' + r.status); }
                    return r.json();
                });
            }

            // 读取浏览器 CacheStorage 里实际缓存的文件及大小
            function listCached() {
                if (!('caches' in window)) { return Promise.resolve([]); }
                return caches.keys().then(function (names) {
                    return Promise.all(names.map(function (name) {
                        return caches.open(name).then(function (cache) {
                            return cache.keys().then(function (reqs) {
                                return Promise.all(reqs.map(function (req) {
                                    var p = new URL(req.url).pathname;
                                    if (p.indexOf('/__meta/') === 0) { return null; } // 跳过内部 meta
                                    return cache.match(req).then(function (res) {
                                        var size = null;
                                        if (res) {
                                            var cl = res.headers.get('Content-Length');
                                            if (cl && !isNaN(+cl)) { size = +cl; }
                                        }
                                        return { path: p, size: size };
                                    });
                                }));
                            });
                        });
                    })).then(function (arrs) {
                        var seen = {}, out = [];
                        arrs.forEach(function (a) {
                            (a || []).forEach(function (x) {
                                if (!x || seen[x.path]) { return; }
                                seen[x.path] = true;
                                out.push(x);
                            });
                        });
                        return out;
                    });
                }).catch(function () { return []; });
            }

            function listRow(path, size, extra) {
                return '<div style="padding:1px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' +
                    '<span style="color:#333">' + esc(path) + '</span>' +
                    '<span style="float:right;color:#888;margin-left:8px">' + fmtSize(size) +
                    (extra ? ' ' + esc(extra) : '') + '</span></div>';
            }

            function groupBlock(title, items) {
                if (!items.length) { return ''; }
                var h = '<div style="font-weight:700;margin:12px 0 2px">' + esc(title) + '</div>';
                return h + items.map(function (it) { return listRow(it[0], it[1], it[2]); }).join('');
            }

            function render(container) {
                Promise.all([
                    fetchJSON(DATA_URL).catch(function () {
                        // 旧版本没有 build-info.json：退回 version.json，仅能列出文件清单
                        return fetchJSON(FALLBACK_URL).catch(function () { return null; })
                            .then(function (m) {
                                if (!m) { return null; }
                                var files = {};
                                Object.keys(m).forEach(function (k) { files[k] = null; });
                                return { engineVersion: '未知', updatedAt: '未知', files: files };
                            });
                    }),
                    listCached()
                ]).then(function (r) {
                    var info = r[0], cached = r[1] || [];
                    var cachedMap = {};
                    cached.forEach(function (c) { cachedMap[c.path] = c.size; });

                    var html = '';
                    html += '<div style="font-weight:700;margin:12px 0 2px">引擎版本</div>' +
                        '<div>' + esc(info && info.engineVersion ? info.engineVersion : '未知') + '</div>';
                    html += '<div style="font-weight:700;margin:12px 0 2px">最近更新时间</div>' +
                        '<div>' + esc(info && info.updatedAt ? info.updatedAt : '未知') + '</div>';

                    // 更新文件及大小（本次构建），按 引擎/界面 分组，并标注未缓存
                    var engineFiles = [], uiFiles = [];
                    if (info && info.files) {
                        Object.keys(info.files).sort().forEach(function (p) {
                            var inCache = (p in cachedMap);
                            var row = [p, info.files[p], inCache ? '' : '（未缓存）'];
                            (p.indexOf('/wasm/') === 0 ? engineFiles : uiFiles).push(row);
                        });
                    }
                    var updatedHtml = groupBlock('引擎文件', engineFiles) + groupBlock('界面资源', uiFiles);
                    html += '<div style="font-weight:700;margin:12px 0 2px">更新文件（本次构建）</div>' +
                        (updatedHtml || '<div>无数据</div>');

                    // 缓存文件及大小（浏览器实际缓存）
                    var cachedRows = cached.slice().sort(function (a, b) { return a.path < b.path ? -1 : 1; })
                        .map(function (c) { return [c.path, c.size, '']; });
                    var cachedHtml = groupBlock('引擎文件', cachedRows.filter(function (r) { return r[0].indexOf('/wasm/') === 0; })) +
                        groupBlock('界面资源', cachedRows.filter(function (r) { return r[0].indexOf('/wasm/') !== 0; }));
                    html += '<div style="font-weight:700;margin:12px 0 2px">缓存文件（浏览器缓存）</div>' +
                        (cachedHtml || '<div>（空）</div>');

                    container.innerHTML = html;
                }).catch(function () {
                    container.innerHTML = '<div>无法读取版本信息</div>';
                });
            }

            function tryInject() {
                var about = document.querySelector('.about');
                if (!about) { return false; }
                var content = about.querySelector('.content');
                if (!content) { return false; }
                if (injected.get(content)) { return true; }
                injected.set(content, true);
                var box = document.createElement('div');
                box.setAttribute('data-xiangqi-about-info', '1');
                box.style.cssText = 'border-top:1px dashed #c5bdbd;margin-top:14px;padding:4px 20px 14px;' +
                    'font-size:0.8rem;color:#333;line-height:1.7;text-align:left;overflow:hidden';
                box.innerHTML = '<div>加载中…</div>';
                content.appendChild(box);
                render(box);
                return true;
            }

            var tries = 0;
            function onMaybeOpen() {
                if (tryInject()) { return; }
                if (++tries > 20) { return; }
                setTimeout(onMaybeOpen, 150); // 等 Vue 把对话框内容渲染完
            }

            new MutationObserver(onMaybeOpen).observe(document.documentElement, { childList: true, subtree: true });
            onMaybeOpen(); // 页面加载时若 About 已打开则立即尝试
        })();
    </script>
